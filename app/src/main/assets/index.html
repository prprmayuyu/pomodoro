*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text)}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif}.app{max-width:720px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom))}.nav{display:flex;justify-content:center;gap:32px;border-bottom:1px solid var(--border);padding-bottom:12px;margin-bottom:24px}.nav button{border:0;background:none;color:var(--muted);font-size:14px}.nav button.on{color:var(--text);font-weight:600}.view{display:none}.view.on{display:block}.muted{color:var(--muted)}.center{text-align:center}.timerTop{font-size:13px;text-align:center;margin-bottom:20px}.timerTop div+div{margin-top:5px;color:var(--text)}.ring{--p:0deg;width:min(72vw,300px);aspect-ratio:1;margin:0 auto 30px;border-radius:50%;background:conic-gradient(var(--primary) var(--p),var(--border) 0);display:grid;place-items:center;position:relative}.ring:after{content:"";position:absolute;inset:4%;border-radius:50%;background:var(--bg)}.ringIn{z-index:1;text-align:center;max-width:80%}.time{font-size:clamp(54px,15vw,82px);font-weight:500;letter-spacing:-.055em;font-variant-numeric:tabular-nums}.hint{font-size:13px;color:var(--muted);margin-top:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.field,.buttons{max-width:440px;margin:auto}.field label{display:block;font-size:13px;margin-bottom:8px}.input{width:100%;border:1px solid var(--border);background:transparent;color:var(--text);border-radius:16px;padding:13px 14px;font-size:16px;outline:none}.input:focus{border-color:var(--primary)}.buttons{display:flex;gap:10px;margin-top:12px}.btn{min-height:48px;border:1px solid var(--border);border-radius:16px;background:transparent;color:var(--text);padding:11px 16px}.btn.primary{flex:1;background:var(--primary);border-color:var(--primary);color:var(--pt);font-weight:600}.note{max-width:440px;margin:14px auto 0;background:var(--surface);border-radius:16px;padding:12px 14px;font-size:13px;display:none}.note.on{display:block}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:24px}.metric{background:var(--surface);border-radius:16px;text-align:center;padding:12px 6px}.metric small{color:var(--muted)}.metric b{display:block;font-size:23px;margin:4px}.calHead{display:flex;justify-content:space-between;align-items:end;margin-bottom:10px}.calHead b{font-size:16px}.calNav button{width:34px;height:34px;border:1px solid var(--border);border-radius:11px;background:transparent;color:var(--text)}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.wk{text-align:center;color:var(--muted);font-size:11px;padding:4px}.day{aspect-ratio:1;border:1px solid transparent;border-radius:11px;background:transparent;color:var(--text);display:flex;flex-direction:column;justify-content:center;align-items:center;font-size:13px}.day.sel{border-color:var(--primary)}.day em{font-style:normal;font-size:9px;color:var(--muted);min-height:11px}.detail{border-top:1px solid var(--border);margin-top:22px;padding-top:18px}.detailHead{display:flex;justify-content:space-between;align-items:end;margin-bottom:16px}.detailHead small{color:var(--muted)}.detailHead b{display:block;font-size:22px;margin-top:3px}.chart{display:flex;align-items:center;gap:20px}.pie{width:150px;height:150px;border-radius:50%;background:var(--surface);flex:0 0 auto}.legend{flex:1;min-width:0}.leg{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px}.leg:last-child{border:0}.dot{width:9px;height:9px;border-radius:50%}.leg span:nth-child(2){flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.settings h2{font-size:17px;margin:0}.settings p{font-size:13px;color:var(--muted);margin:5px 0 14px}.themes{display:grid;gap:10px;margin-bottom:28px}.theme{border:1px solid var(--border);border-radius:17px;background:transparent;padding:11px;color:v ;font-size:12px;line-height:1.45}.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,10px);background:var(--text);color:var(--bg);padding:8px 13px;border-radius:99px;font-size:12px;opacity:0;transition:.18s;pointer-events:none}.toast.on{opacity:1;transform:translate(-50%,0)}@media(max-width:480px){.chart{flex-direction:column}.legend{width:100%}.pie{width:140px;height:140px}.formRow{grid-template-columns:105px 1fr}}

<body data-theme="mono">
<div class="app">
<nav class="nav"><button class="on" data-v="timer">计时</button><button data-v="history">记录</button><button data-v="settings">设置</button></nav>
<section id="timer" class="view on"><div class="timerTop muted"><div id="phase">专注</div><div id="today">今天 · 0 个番茄</div></div><div class="ring" id="ring"><div class="ringIn"><div class="time" id="clock">25:00</div><div class="hint" id="hint">准备开始</div></div></div><div class="field"><label for="task">这 25 分钟做什么？</label><input id="task" class="input" maxlength="40" placeholder="例如：写游戏策划"></div><div class="buttons"><button id="start" class="btn primary">开始</button><button id="end" class="btn" style="display:none">结束</button></div><div id="notice" class="note"></div></section>

<section id="settings" class="view settings"><h2>外观</h2><p>只改变颜色，不改变番茄钟本身。</p><div class="themes"><button class="theme sel" data-theme="mono"><div class="palette"><i style="background:#fff"></i><i style="background:#eee"></i><i style="background:#bbb"></i><i style="background:#555"></i><i style="background:#111"></i></div><div class="themeRow"><div><b>黑白</b><small>默认 · 最克制</small></div><span>✓</span></div></button><button class="theme" data-theme="sweet"><div class="palette"><i style="background:#cdb4db"></i><i style="background:#ffc8dd"></i><i style="background:#ffafcc"></i><i style="background:#bde0fe"></i><i style="background:#a2d2ff"></i></div><div class="themeRow"><div><b>甜莓</b><small>粉紫 · 柔和甜美</small></div><span></span></div></button><button class="theme" data-theme="forest"><div class="palette"><i style="background:#dad7cd"></i><i style="background:#a3b18a"></i><i style="background:#588157"></i><i style="background:#3a5a40"></i><i style="background:#344e41"></i></div><div class="themeRow"><div><b>森林</b><small>鼠尾草 · 安静自然</small></div><span></span></div></button></div><h2>通知</h2><p>默认每天 09:00 提醒你开始工作，也可以新增自己的提醒。</p><div class="perm"><div class="permRow"><div><b>通知权限</b><small id="np">检查中…</small></div><button id="npBtn" class="mini">设置</button></div><div class="permRow"><div><b>精确提醒</b><small id="ep">检查中…</small></div><button id="epBtn" class="mini">设置</button></div></div><div id="rems" class="reminders"></div><div class="remForm"><div class="formRow"><div class="timeWrap"><input id="rtime" type="time" value="09:00"></div><input id="rmsg" class="input" maxlength="50" placeholder="通知语"></div><button id="addRem" class="btn primary" style="width:100%">新增提醒</button></div><div class="fixed">专注固定 25 分钟，休息固定 5 分钟。倒计时时屏幕保持常亮；离开 App 后仍按真实时间继续，并在休息开始和结束时发送通知。</div></section>
</div><div id="toast" class="toast"></div>
<script>
(()=>{
const F=25*60e3,B=5*60e3,TK='timer_v1',RK='records_v1',TH='theme_v1',REM='reminders_v1',$=id=>document.getElementById(id),native=()=>typeof Android!=='undefined';let tick,cur=new Date(),sel=key(new Date());cur.setDate(1);
function jget(k,d){try{let v=JSON.parse(localStorage.getItem(k));return v??d}catch{return d}}function save(k,v){localStorage.setItem(k,JSON.stringify(v))}function key(v){let d=v instanceof Date?v:new Date(v);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function call(m,...a){try{if(native()&&typeof Android[m]==='function')return Android[m](...a)}catch{}return null}function timer(){return jget(TK,{running:false,paused:false,phase:'focus',name:'',startedAt:0,focusEnd:0,breakEnd:0,left:0})}function setTimer(v){save(TK,v)}function records(){return jget(RK,[])}function setRecords(v){save(RK,v)}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function toast(s){let e=$('toast');e.textContent=s;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),1600)}
function theme(t){if(!['mono','sweet','forest'].includes(t))t='mono';document.body.dataset.theme=t;localStorage.setItem(TH,t);document.querySelectorAll('.theme').forEach(x=>{let on=x.dataset.theme===t;x.classList.toggle('sel',on);x.querySelector('.themeRow span').textContent=on?'✓':''});call('setTheme',t);detail(sel)}function schedule(s){if(s.running){call('schedulePomodoro',Number(s.focusEnd),Number(s.breakEnd));call('setKeepScreenOn',true)}}function cancel(){call('cancelPomodoro');call('setKeepScreenOn',false)}
function startNew(){let name=$('task').value.trim();if(!name){$('task').focus();$('hint').textContent='先写下这次要做什么';return}let n=Date.now(),s={running:true,paused:false,phase:'focus',name,startedAt:n,focusEnd:n+F,breakEnd:n+F+B,left:0};setTimer(s);schedule(s);render()}function pause(s){let n=Date.now(),p=n<s.focusEnd?'focus':'break';s.running=false;s.paused=true;s.phase=p;s.left=Math.max(0,(p==='focus'?s.focusEnd:s.breakEnd)-n);setTimer(s);cancel();render()}function resume(s){let n=Date.now();s.running=true;s.paused=false;if(s.phase==='break'){s.focusEnd=n;s.breakEnd=n+(s.left||B)}else{s.focusEnd=n+(s.left||F);s.breakEnd=s.focusEnd+B}s.left=0;setTimer(s);schedule(s);render()}
function record(s){if(!s.startedAt||!s.name)return;let r=records();if(r.some(x=>x.id===s.startedAt))return;r.push({id:s.startedAt,startedAt:s.startedAt,date:key(s.startedAt),name:s.name,minutes:25});setRecords(r);stats()}function finish(s){record(s);setTimer({running:false,paused:false,phase:'focus',name:'',startedAt:0,focusEnd:0,breakEnd:0,left:0});cancel();$('task').value='';$('notice').classList.add('on');$('notice').textContent='休息结束。准备好时，可以开始下一轮。';stats()}function end(){let s=timer();if(!s.running&&!s.paused)return;let done=s.startedAt&&((s.running&&Date.now()>=s.focusEnd)||(s.paused&&s.phase==='break'));if(!confirm(done?'结束休息并返回？已完成的番茄仍会保留。':'结束这一轮？未完成的番茄不会计入统计。'))return;if(done)record(s);setTimer({running:false,paused:false,phase:'focus',name:'',startedAt:0,focusEnd:0,breakEnd:0,left:0});cancel();$('task').disabled=false;$('task').value='';$('notice').classList.remove('on');render()}
function clock(ms){let q=Math.max(0,Math.ceil(ms/1000)),m=Math.floor(q/60),s=q%60;return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`}function render(){let s=timer(),n=Date.now();if(s.running&&s.breakEnd&&n>=s.breakEnd){finish(s);return render()}let p='focus',left=F,dur=F,h='准备开始',prog=0;if(s.running){if(n<s.focusEnd){left=s.focusEnd-n;h=s.name;prog=1-left/F}else{record(s);p='break';left=s.breakEnd-n;dur=B;h='休息一下';prog=1-left/B}s.phase=p;setTimer(s)}else if(s.paused){p=s.phase||'focus';left=s.left||(p==='break'?B:F);dur=p==='break'?B:F;h='已暂停';prog=1-left/dur}$('phase').textContent=p==='focus'?'专注':'休息';$('clock').textContent=clock(left);$('hint').textContent=h;$('ring').style.setProperty('--p',`${Math.max(0,Math.min(1,prog))*360}deg`);$('task').disabled=!!(s.running||s.paused);if((s.running||s.paused)&&s.name)$('task').value=s.name;$('start').textContent=s.running?'暂停':s.paused?'继续':'开始';$('end').style.display=(s.running||s.paused)?'block':'none';if(s.running&&p==='break'){$('notice').classList.add('on');$('notice').textContent='休息时间开始了 · 5 分钟'}else if(s.running)$('notice').classList.remove('on');$('today').textContent=`今天 · ${records().filter(x=>x.date===key(new Date())).length} 个番茄`}
$('start').onclick=()=>{let s=timer();s.running?pause(s):s.paused?resume(s):startNew()};$('end').onclick=end;$('task').addEventListener('keydown',e=>{if(e.key==='Enter'&&!timer().running&&!timer().paused)startNew()});
function weekStart(d){d=new Date(d);d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d}function mins(m){if(m<60)return `${m}m`;let h=Math.floor(m/60),x=m%60;return x?`${h}h${x}m`:`${h}h`}function stats(){let r=records(),td=key(new Date()),ws=weekStart(new Date()),we=new Date(ws);we.setDate(we.getDate()+7);let w=r.filter(x=>new Date(x.startedAt)>=ws&&new Date(x.startedAt)<we);$('mt').textContent=r.filter(x=>x.date===td).length;$('mw').textContent=w.length;$('mm').textContent=mins(w.reduce((a,x)=>a+(x.minutes||25),0));$('today').textContent=`今天 · ${r.filter(x=>x.date===td).length} 个番茄`;calendar();detail(sel)}function byDate(){let o={};records().forEach(x=>(o[x.date]??=[]).push(x));return o}
function calendar(){$('calTitle').textContent=`${cur.getFullYear()}年 ${cur.getMonth()+1}月`;let e=$('calendar');e.innerHTML='';['一','二','三','四','五','六','日'].forEach(x=>{let d=document.createElement('div');d.className='wk';d.textContent=x;e.appendChild(d)});let y=cur.getFullYear(),m=cur.getMonth(),off=(new Date(y,m,1).getDay()+6)%7;for(let i=0;i<off;i++)e.appendChild(document.createElement('div'));let total=new Date(y,m+1,0).getDate(),map=byDate();for(let d=1;d<=total;d++){let k=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,b=document.createElement('button');b.className='day'+(k===sel?' sel':'');b.innerHTML=`<span>${d}</span><em>${(map[k]||[]).length||''}</em>`;b.onclick=()=>{sel=k;calendar();detail(k)};e.appendChild(b)}}$('prev').onclick=()=>{cur.setMonth(cur.getMonth()-1);calendar()};$('next').onclick=()=>{cur.setMonth(cur.getMonth()+1);calendar()};function cv(n){return getComputedStyle(document.body).getPropertyValue(n).trim()}
function detail(k){let r=records().filter(x=>x.date===k),e=$('detail'),[y,m,d]=k.split('-').map(Number);if(!r.length){e.innerHTML=`<div class="detailHead"><div><small>${m}月${d}日</small><b>0 个番茄</b></div><small>0 分钟</small></div><div class="fixed">这一天还没有专注记录。</div>`;return}let g={};r.forEach(x=>g[x.name]=(g[x.name]||0)+1);let items=Object.entries(g).sort((a,b)=>b[1]-a[1]),acc=0,cols=['--s1','--s2','--s3','--s4'],seg=[];items.forEach((x,i)=>{let a=acc/r.length*100;acc+=x[1];seg.push(`${cv(cols[i%4])} ${a}% ${acc/r.length*100}%`)});let lg=items.map((x,i)=>`<div class="leg"><i class="dot" style="background:${cv(cols[i%4])}"></i><span>${esc(x[0])}</span><small>${x[1]} 个</small></div>`).join('');e.innerHTML=`<div class="detailHead"><div><small>${m}月${d}日</small><b>${r.length} 个番茄</b></div><small>${r.length*25} 分钟</small></div><div class="chart"><div class="pie" style="background:conic-gradient(${seg.join(',')})"></div><div class="legend">${lg}</div></div>`}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('on',x===b));document.querySelectorAll('.view').forEach(x=>x.classList.remove('on'));$(b.dataset.v).classList.add('on');if(b.dataset.v==='history')stats();if(b.dataset.v==='settings')permissions()});document.querySelectorAll('.theme').forEach(b=>b.onclick=()=>theme(b.dataset.theme));
function defaults(){return[{id:'default_work',time:'09:00',message:'该开始工作了',enabled:true}]}function rems(){let x=jget(REM,null);if(!Array.isArray(x)){x=defaults();save(REM,x)}return x}function sched(r){if(!r.enabled){call('cancelDailyReminder',r.id);return}let[h,m]=r.time.split(':').map(Number);call('scheduleDailyReminder',r.id,h,m,r.message)}function sync(){rems().forEach(sched)}function renderRems(){let a=rems(),e=$('rems');e.innerHTML='';a.forEach((r,i)=>{let d=document.createElement('div');d.className='rem';d.innerHTML=`<div><div class="remTime">${r.time}</div><div class="remMsg">${esc(r.message)}</div></div><div class="remBtns"><label class="switch"><input type="checkbox" ${r.enabled?'checked':''}><i></i></label><button class="tiny edit">编辑</button>${r.id==='default_work'?'':'<button class="tiny del">删除</button>'}</div>`;d.querySelector('input').onchange=v=>{let z=rems();z[i].enabled=v.target.checked;save(REM,z);sched(z[i]);toast(v.target.checked?'提醒已开启':'提醒已关闭')};d.querySelector('.edit').onclick=()=>{$('rtime').value=r.time;$('rmsg').value=r.message;$('addRem').dataset.edit=r.id;$('addRem').textContent='保存修改'};let del=d.querySelector('.del');if(del)del.onclick=()=>{let z=rems();call('cancelDailyReminder',z[i].id);z.splice(i,1);save(REM,z);renderRems();toast('提醒已删除')};e.appendChild(d)})}
$('addRem').onclick=()=>{let t=$('rtime').value||'09:00',m=$('rmsg').value.trim();if(!m){$('rmsg').focus();return}let a=rems(),id=$('addRem').dataset.edit;if(id){let i=a.findIndex(x=>x.id===id);if(i>=0){a[i].time=t;a[i].message=m;a[i].enabled=true;sched(a[i])}delete $('addRem').dataset.edit;$('addRem').textContent='新增提醒';toast('提醒已修改')}else{let r={id:'custom_'+Date.now(),time:t,message:m,enabled:true};a.push(r);sched(r);toast('提醒已新增')}save(REM,a);$('rmsg').value='';renderRems()};function permissions(){if(!native()){$('np').textContent='APK 中可用';$('ep').textContent='APK 中可用';return}let n=false,e=false;try{n=Android.hasNotificationPermission()}catch{}try{e=Android.canScheduleExactAlarms()}catch{}$('np').textContent=n?'已允许':'未允许，提醒不会显示';$('ep').textContent=e?'已允许 · 按设定时间提醒':'未允许 · 系统可能稍有延迟'}$('npBtn').onclick=()=>{if(native()){let a=false;try{a=Android.hasNotificationPermission()}catch{}a?Android.openNotificationSettings():Android.requestNotificationPermission()}setTimeout(permissions,400)};$('epBtn').onclick=()=>{if(native())Android.requestExactAlarmAccess()};
window.onNativeResume=()=>{permissions();sync();let s=timer();if(s.running)schedule(s);render()};theme(localStorage.getItem(TH)||'mono');renderRems();sync();permissions();stats();render();tick=setInterval(render,500);let s=timer();if(s.running)schedule(s);
})();
