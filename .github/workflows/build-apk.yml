name: Build APK

on:
  push:
    branches: [ main, app-v1, app-v2, app-v3, app-v4, app-v5 ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate JavaScript assets
        run: |
          node --check app/src/main/assets/v2_patch.js
          node --check app/src/main/assets/v3_patch.js
          node --check app/src/main/assets/v3_ui_fix.js
          node --check app/src/main/assets/v4_patch.js
          node --check app/src/main/assets/v5_main.js

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Prepare stable debug signing key
        run: base64 --decode app/signing/pomodoro-debug.jks.b64 > app/pomodoro-debug.jks

      - name: Set up Gradle 9.1.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.1.0'
          cache-provider: basic

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/YiLiFanQieQie_v5.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YiLiFanQieQie_v5
          path: output/YiLiFanQieQie_v5.apk
          if-no-files-found: error
