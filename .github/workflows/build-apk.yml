name: Build APK

on:
  push:
    branches: [ main, app-v1 ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.1.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.1.0'
          cache-provider: basic

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/YiLiFanQieQie_v1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YiLiFanQieQie_v1
          path: output/YiLiFanQieQie_v1.apk
          if-no-files-found: error
